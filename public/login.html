<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise SA - Secure Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Professional Banking Colors */
            --navy-900: #002855;
            --blue-700: #0052CC;
            --blue-600: #0747A6;
            --blue-500: #0065FF;
            --blue-400: #4C9AFF;
            --blue-100: #DEEBFF;
            --blue-50: #F0F5FF;
            
            --teal-700: #00875A;
            --teal-500: #00C777;
            --teal-100: #E3FCEF;
            
            --red-700: #DE350B;
            --red-600: #BF2600;
            --red-100: #FFEBE6;
            
            /* Neutral Grays */
            --gray-900: #091E42;
            --gray-800: #172B4D;
            --gray-700: #253858;
            --gray-600: #42526E;
            --gray-500: #5E6C84;
            --gray-400: #7A869A;
            --gray-300: #DFE1E6;
            --gray-200: #EBECF0;
            --gray-100: #F4F5F7;
            --gray-50: #FAFBFC;
            
            /* Shadows */
            --shadow-card: 0 1px 1px rgba(9, 30, 66, 0.08), 0 0 1px rgba(9, 30, 66, 0.31);
            --shadow-elevated: 0 4px 8px rgba(9, 30, 66, 0.08), 0 0 1px rgba(9, 30, 66, 0.31);
            --shadow-overlay: 0 8px 16px rgba(9, 30, 66, 0.12), 0 0 1px rgba(9, 30, 66, 0.31);
            
            /* Typography */
            --font-primary: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --font-mono: 'IBM Plex Mono', 'SF Mono', Monaco, monospace;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: var(--font-primary);
            background: linear-gradient(135deg, #F0F5FF 0%, #FAFBFC 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* Background Pattern */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(0, 82, 204, 0.04) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 135, 90, 0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }
        
        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
        }
        
        /* Logo Section */
        .logo-section {
            text-align: center;
            margin-bottom: 48px;
        }
        
        .logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--navy-900) 0%, var(--blue-700) 100%);
            padding: 16px 32px;
            border-radius: 6px;
            margin-bottom: 16px;
            box-shadow: var(--shadow-elevated);
        }
        
        .logo-text {
            font-size: 1.75rem;
            font-weight: 700;
            color: white;
            letter-spacing: -0.02em;
        }
        
        .logo-tagline {
            font-size: 0.9375rem;
            color: var(--gray-600);
            font-weight: 500;
        }
        
        /* Login Card */
        .login-card {
            background: white;
            border-radius: 12px;
            padding: 48px;
            box-shadow: var(--shadow-overlay);
            border: 1px solid var(--gray-200);
        }
        
        .card-header {
            margin-bottom: 32px;
        }
        
        .card-title {
            font-size: 1.875rem;
            font-weight: 600;
            color: var(--gray-900);
            margin-bottom: 8px;
            letter-spacing: -0.015em;
        }
        
        .card-subtitle {
            font-size: 0.9375rem;
            color: var(--gray-600);
            line-height: 1.5;
        }
        
        /* Alert Messages */
        .alert {
            padding: 16px;
            border-radius: 6px;
            margin-bottom: 24px;
            display: none;
            gap: 12px;
            align-items: flex-start;
            animation: slideDown 0.3s ease;
        }
        
        .alert.show {
            display: flex;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .alert-error {
            background: var(--red-100);
            border: 1px solid var(--red-600);
            color: var(--red-600);
        }
        
        .alert-success {
            background: var(--teal-100);
            border: 1px solid var(--teal-700);
            color: var(--teal-700);
        }
        
        .alert-icon {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            margin-top: 2px;
        }
        
        .alert-content {
            flex: 1;
        }
        
        .alert-title {
            font-weight: 600;
            font-size: 0.9375rem;
            margin-bottom: 4px;
        }
        
        .alert-message {
            font-size: 0.875rem;
            line-height: 1.5;
            opacity: 0.95;
        }
        
        /* Form Styles */
        .form-group {
            margin-bottom: 24px;
        }
        
        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--gray-700);
            margin-bottom: 8px;
        }
        
        .input-wrapper {
            position: relative;
        }
        
        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            color: var(--gray-400);
            pointer-events: none;
        }
        
        .form-input {
            width: 100%;
            padding: 11px 14px 11px 44px;
            border: 2px solid var(--gray-300);
            border-radius: 4px;
            font-family: var(--font-primary);
            font-size: 0.9375rem;
            color: var(--gray-900);
            background: white;
            transition: all 0.15s ease;
        }
        
        .form-input:hover {
            border-color: var(--gray-400);
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--blue-700);
            box-shadow: 0 0 0 3px var(--blue-100);
        }
        
        .form-input::placeholder {
            color: var(--gray-400);
        }
        
        .form-input.error {
            border-color: var(--red-700);
            background: #FFF9F9;
        }
        
        .form-input.error:focus {
            box-shadow: 0 0 0 3px var(--red-100);
        }
        
        .error-message {
            font-size: 0.8125rem;
            color: var(--red-700);
            margin-top: 6px;
            font-weight: 500;
            display: none;
            align-items: center;
            gap: 6px;
        }
        
        .error-message.show {
            display: flex;
        }
        
        .helper-text {
            font-size: 0.8125rem;
            color: var(--gray-500);
            margin-top: 6px;
            line-height: 1.4;
        }
        
        /* Checkbox */
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
        }
        
        .checkbox-input {
            width: 18px;
            height: 18px;
            border: 2px solid var(--gray-300);
            border-radius: 3px;
            cursor: pointer;
            appearance: none;
            background: white;
            transition: all 0.15s ease;
            position: relative;
        }
        
        .checkbox-input:checked {
            background: var(--blue-700);
            border-color: var(--blue-700);
        }
        
        .checkbox-input:checked::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 12px;
            font-weight: 700;
        }
        
        .checkbox-label {
            font-size: 0.875rem;
            color: var(--gray-700);
            cursor: pointer;
            user-select: none;
        }
        
        /* Buttons */
        .btn {
            width: 100%;
            padding: 12px 24px;
            border-radius: 4px;
            font-family: var(--font-primary);
            font-size: 0.9375rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: var(--blue-700);
            color: white;
            box-shadow: 0 1px 2px rgba(0, 82, 204, 0.2);
        }
        
        .btn-primary:hover:not(:disabled) {
            background: var(--blue-600);
            box-shadow: 0 2px 4px rgba(0, 82, 204, 0.3);
            transform: translateY(-1px);
        }
        
        .btn-primary:active:not(:disabled) {
            background: var(--navy-900);
            transform: translateY(0);
        }
        
        .btn-primary:disabled {
            background: var(--gray-300);
            color: var(--gray-500);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .btn-secondary {
            background: white;
            color: var(--gray-700);
            border: 2px solid var(--gray-300);
            box-shadow: var(--shadow-card);
        }
        
        .btn-secondary:hover {
            background: var(--gray-50);
            border-color: var(--gray-400);
        }
        
        .btn-loading {
            position: relative;
            color: transparent;
        }
        
        .btn-loading::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            top: 50%;
            left: 50%;
            margin-left: -8px;
            margin-top: -8px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.6s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Links */
        .link {
            color: var(--blue-700);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9375rem;
            transition: color 0.15s ease;
        }
        
        .link:hover {
            color: var(--blue-600);
            text-decoration: underline;
        }
        
        .link-right {
            text-align: right;
            display: block;
            margin-top: 8px;
        }
        
        .link-center {
            text-align: center;
            display: block;
            padding: 12px;
        }
        
        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 28px 0;
        }
        
        .divider-line {
            flex: 1;
            height: 1px;
            background: var(--gray-300);
        }
        
        .divider-text {
            color: var(--gray-500);
            font-size: 0.8125rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        /* Security Badge */
        .security-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: var(--teal-100);
            border: 1px solid var(--teal-700);
            border-radius: 4px;
            margin-top: 20px;
        }
        
        .security-icon {
            width: 18px;
            height: 18px;
            color: var(--teal-700);
        }
        
        .security-text {
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--teal-700);
            letter-spacing: 0.3px;
        }
        
        /* Responsive */
        @media (max-width: 480px) {
            body {
                padding: 20px;
            }
            
            .login-card {
                padding: 32px 24px;
            }
            
            .card-title {
                font-size: 1.5rem;
            }
            
            .logo-text {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- Logo Section -->
        <div class="logo-section">
            <div class="logo">
                <div class="logo-text">SpendWise SA</div>
            </div>
            <div class="logo-tagline">Secure Financial Management</div>
        </div>

        <!-- Login Card -->
        <div class="login-card">
            <div class="card-header">
                <h1 class="card-title">Sign In</h1>
                <p class="card-subtitle">Access your financial dashboard</p>
            </div>

            <!-- Alert Messages -->
            <div id="alertBox" class="alert">
                <svg class="alert-icon" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
                </svg>
                <div class="alert-content">
                    <div class="alert-title" id="alertTitle"></div>
                    <div class="alert-message" id="alertMessage"></div>
                </div>
            </div>

            <!-- Login Form -->
            <form id="loginForm">
                <!-- Email Field -->
                <div class="form-group">
                    <label for="email" class="form-label">
                        Email Address
                    </label>
                    <div class="input-wrapper">
                        <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                        </svg>
                        <input
                            id="email"
                            type="email"
                            name="email"
                            class="form-input"
                            placeholder="user@example.com"
                            autocomplete="email"
                        />
                    </div>
                    <div id="emailError" class="error-message">
                        ⚠ <span id="emailErrorText"></span>
                    </div>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <label for="password" class="form-label">
                        Password
                    </label>
                    <div class="input-wrapper">
                        <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                        </svg>
                        <input
                            id="password"
                            type="password"
                            name="password"
                            class="form-input"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                        />
                    </div>
                    <div id="passwordError" class="error-message">
                        ⚠ <span id="passwordErrorText"></span>
                    </div>
                    <a href="#" class="link link-right" id="forgotPassword">
                        Forgot your password?
                    </a>
                </div>

                <!-- Remember Me -->
                <div class="checkbox-group">
                    <input
                        id="rememberMe"
                        type="checkbox"
                        name="rememberMe"
                        class="checkbox-input"
                    />
                    <label for="rememberMe" class="checkbox-label">
                        Keep me signed in for 30 days
                    </label>
                </div>

                <!-- Submit Button -->
                <button
                    type="submit"
                    id="submitBtn"
                    class="btn btn-primary"
                >
                    Sign In Securely
                </button>
            </form>

            <!-- Divider -->
            <div class="divider">
                <div class="divider-line"></div>
                <div class="divider-text">New to SpendWise?</div>
                <div class="divider-line"></div>
            </div>

            <!-- Create Account Button -->
            <button class="btn btn-secondary" id="createAccountBtn">
                Create Account
            </button>

            <!-- Security Badge -->
            <div style="text-align: center;">
                <div class="security-badge">
                    <svg class="security-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                    </svg>
                    <span class="security-text">256-BIT SSL ENCRYPTION</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Get form elements
        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const submitBtn = document.getElementById('submitBtn');
        const alertBox = document.getElementById('alertBox');
        const alertTitle = document.getElementById('alertTitle');
        const alertMessage = document.getElementById('alertMessage');
        const emailError = document.getElementById('emailError');
        const emailErrorText = document.getElementById('emailErrorText');
        const passwordError = document.getElementById('passwordError');
        const passwordErrorText = document.getElementById('passwordErrorText');
        const forgotPasswordLink = document.getElementById('forgotPassword');
        const createAccountBtn = document.getElementById('createAccountBtn');

        // Validation functions
        function validateEmail(email) {
            const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return regex.test(email);
        }

        function showError(element, errorTextElement, message) {
            element.classList.add('show');
            errorTextElement.textContent = message;
            element.previousElementSibling.querySelector('.form-input').classList.add('error');
        }

        function hideError(element) {
            element.classList.remove('show');
            element.previousElementSibling.querySelector('.form-input').classList.remove('error');
        }

        function showAlert(type, title, message) {
            alertBox.className = 'alert show alert-' + type;
            alertTitle.textContent = title;
            alertMessage.textContent = message;
        }

        function hideAlert() {
            alertBox.classList.remove('show');
        }

        // Clear errors when user starts typing
        emailInput.addEventListener('input', function() {
            hideError(emailError);
            hideAlert();
        });

        passwordInput.addEventListener('input', function() {
            hideError(passwordError);
            hideAlert();
        });

        // Form submission
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Clear previous errors
            hideError(emailError);
            hideError(passwordError);
            hideAlert();

            // Get form values
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            let hasErrors = false;

            // Validate email
            if (!email) {
                showError(emailError, emailErrorText, 'Email address is required');
                hasErrors = true;
            } else if (!validateEmail(email)) {
                showError(emailError, emailErrorText, 'Please enter a valid email address');
                hasErrors = true;
            }

            // Validate password
            if (!password) {
                showError(passwordError, passwordErrorText, 'Password is required');
                hasErrors = true;
            } else if (password.length < 8) {
                showError(passwordError, passwordErrorText, 'Password must be at least 8 characters');
                hasErrors = true;
            }

            // If there are errors, stop here
            if (hasErrors) {
                return;
            }

            // Show loading state
            submitBtn.classList.add('btn-loading');
            submitBtn.disabled = true;

            // Simulate API call
            setTimeout(function() {
                submitBtn.classList.remove('btn-loading');
                submitBtn.disabled = false;

                // Check credentials (demo)
                if (email === 'demo@spendwise.co.za' && password === 'Demo123!') {
                    showAlert('success', 'Login Successful', 'Redirecting to your dashboard...');
                    
                    setTimeout(function() {
                        alert('✅ Authentication successful!\n\nIn a production environment, you would now be redirected to the SpendWise SA dashboard.\n\nThis is a demo showcasing the professional login interface design and functionality.');
                    }, 1000);
                } else {
                    showAlert('error', 'Authentication Failed', 'The email address or password you entered is incorrect. Please verify your credentials and try again.');
                }
            }, 1500);
        });

        // Forgot password link
        forgotPasswordLink.addEventListener('click', function(e) {
            e.preventDefault();
            alert('🔐 Password Reset\n\nIn a production environment, this would open the password recovery flow where you can reset your password via email verification.');
        });

        // Create account button
        createAccountBtn.addEventListener('click', function() {
            alert('📝 Registration\n\nIn a production environment, this would navigate to the account creation page.\n\nTry the demo login:\n📧 demo@spendwise.co.za\n🔑 Demo123!');
        });
    </script>
</body>
</html>
